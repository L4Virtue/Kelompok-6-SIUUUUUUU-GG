<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Peserta Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-1" >
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Formulir Tambah Peserta</h4>
        </div>
        <div class="card-body">
            
            <div id="notifikasi"></div>

            <form id="formPeserta">
                <div class="mb-3">
                    <label for="nama" class="form-label">Nama Peserta</label>
                    <input type="text" class="form-control" id="nama" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="mb-3">
                    <label for="instansi" class="form-label">Asal Instansi / Kampus</label>
                    <input type="text" class="form-control" id="instansi" placeholder="Contoh: Telkom University" required>
                </div>

                <div class="mb-3">
                    <label for="kontak" class="form-label">Nomor Kontak (WhatsApp)</label>
                    <input type="tel" class="form-control" id="kontak" placeholder="08xxxxxxxxxx" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Aktif</label>
                    <input type="email" class="form-control" id="email" placeholder="nama@email.com" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="indeks.html" class="btn btn-secondary">Kembali ke Daftar</a>
                    <button type="submit" class="btn btn-success">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
